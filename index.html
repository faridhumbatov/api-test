<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hissə-hissə Yükləmə (Pagination)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-5 text-gray-800">İstifadəçilər (Limitlə Yükləmə)</h1>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="min-w-full">
                <thead>
                    <tr class="bg-green-600 text-white">
                        <th class="px-5 py-3 text-left">Ad Soyad</th>
                        <th class="px-5 py-3 text-left">Email</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    </tbody>
            </table>
        </div>

        <div class="mt-6 flex justify-center">
            <button id="loadMoreBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full transition duration-300">
                Daha çox yüklə...
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, orderByChild, limitToFirst, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://api-test-thefeerid-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentLimit = 10; // Hər dəfə neçə nəfər gəlsin

        async function fetchUsers() {
            // Sorğunu hazırlayırıq: ID-yə görə sırala və ilk X dənəsini gətir
            const userQuery = query(ref(db, '/'), limitToFirst(currentLimit));
            
            try {
                const snapshot = await get(userQuery);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const usersArray = Object.values(data);
                    displayUsers(usersArray);
                } else {
                    alert("Daha məlumat yoxdur.");
                }
            } catch (error) {
                console.error("Xəta:", error);
            }
        }

        function displayUsers(users) {
            const tableBody = document.getElementById('userTableBody');
            tableBody.innerHTML = users.map(user => `
                <tr class="border-b border-gray-200 hover:bg-gray-50">
                    <td class="px-5 py-4">${user.first_name} ${user.last_name}</td>
                    <td class="px-5 py-4">${user.email}</td>
                </tr>
            `).join('');
        }

        // "Daha çox" düyməsinə basanda limiti artırırıq
        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            currentLimit += 10;
            fetchUsers();
        });

        // İlk açılışda çağır
        fetchUsers();
    </script>
</body>
</html>
