<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Professional Firebase API Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6">

    <div class="max-w-5xl mx-auto">
        <div class="mb-8">
            <input type="text" id="searchInput" placeholder="Tam adı yazın və Enter basın (Məs: Rebeka)..." 
                   class="w-full p-4 rounded-xl border-2 border-blue-100 shadow-sm focus:border-blue-500 outline-none transition-all">
            <p class="text-xs text-gray-500 mt-2">* Server tərəfli axtarış üçün tam dəqiq ad yazılmalıdır.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-white">
                        <th class="p-4">ID</th>
                        <th class="p-4">Ad Soyad</th>
                        <th class="p-4">Email</th>
                        <th class="p-4">Ölkə</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>

        <div id="paginationControls" class="mt-8 flex justify-center">
            <button id="loadMoreBtn" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 shadow-lg active:scale-95 transition-all">
                Daha 100 nəfər yüklə
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, orderByChild, limitToFirst, equalTo, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://api-test-thefeerid-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentLimit = 100;
        let isSearching = false;

        // Əsas Funksiya: Dataları gətir
        async function fetchUsers(searchTerm = "") {
    const userQuery = query(ref(db, '/'), limitToFirst(1000)); // İlk 1000 nəfəri çəkirik
    
    try {
        const snapshot = await get(userQuery);
        const data = snapshot.val();
        let usersArray = data ? Object.values(data) : [];

        if (searchTerm) {
            // BRAUZERDƏ AXTARIŞ: Böyük-kiçik hərf fərqini aradan qaldırır
            const lowerSearch = searchTerm.toLowerCase();
            usersArray = usersArray.filter(u => 
                u.first_name.toLowerCase().includes(lowerSearch) || 
                u.last_name.toLowerCase().includes(lowerSearch) ||
                u.email.toLowerCase().includes(lowerSearch)
            );
            document.getElementById('paginationControls').classList.add('hidden');
        } else {
            document.getElementById('paginationControls').classList.remove('hidden');
            // Əgər axtarış yoxdursa, limiti tətbiq et
            usersArray = usersArray.slice(0, currentLimit);
        }

        renderTable(usersArray);
    } catch (err) { console.error("Xəta:", err); }
}

        function renderTable(users) {
            const tableBody = document.getElementById('userTableBody');
            if (users.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-gray-400">Məlumat tapılmadı...</td></tr>`;
                return;
            }
            tableBody.innerHTML = users.map(u => `
                <tr class="border-b hover:bg-blue-50 transition-colors">
                    <td class="p-4 text-gray-500">#${u.id}</td>
                    <td class="p-4 font-medium">${u.first_name} ${u.last_name}</td>
                    <td class="p-4 text-blue-600">${u.email}</td>
                    <td class="p-4"><span class="bg-gray-200 px-2 py-1 rounded text-xs">${u.country}</span></td>
                </tr>
            `).join('');
        }

        // Event Listeners
        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            currentLimit += 100;
            fetchUsers();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                fetchUsers(e.target.value.trim());
            }
        });

        // İlkin yükləmə
        fetchUsers();
    </script>
</body>
</html>
