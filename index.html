<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Firestore Advanced API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-4">
            <input type="text" id="nameFilter" placeholder="Adla axtar (kiçik hərflə)..." class="p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
            
            <select id="cardTypeFilter" class="p-2 border rounded-lg outline-none">
                <option value="">Bütün Kartlar</option>
                <option value="visa">Visa</option>
                <option value="mastercard">Mastercard</option>
                <option value="maestro">Maestro</option>
            </select>

            <select id="currencyFilter" class="p-2 border rounded-lg outline-none">
                <option value="">Bütün Valyutalar</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="UAH">UAH</option>
            </select>

            <button id="searchBtn" class="bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition">Axtar</button>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-800 text-white">
                    <tr>
                        <th class="p-4">Müştəri</th>
                        <th class="p-4">Kart</th>
                        <th class="p-4">Balans</th>
                        <th class="p-4">Ölkə</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="4" class="p-10 text-center text-gray-400">Yüklənir...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, limit, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ÖZ KONFİQURASİYANIZI BURA ƏLAVƏ EDİN
       const firebaseConfig = {
  apiKey: "AIzaSyAx-jHMIBpWtIRNHSK2NJRoTKmKl3Fst8Q",
  authDomain: "api-test-thefeerid.firebaseapp.com",
  databaseURL: "https://api-test-thefeerid-default-rtdb.firebaseio.com",
  projectId: "api-test-thefeerid",
  storageBucket: "api-test-thefeerid.firebasestorage.app",
  messagingSenderId: "129418422478",
  appId: "1:129418422478:web:970653fc985acb4ce4c89f",
  measurementId: "G-B5DVJXYZN2"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function getData() {
    const tableBody = document.getElementById('userTableBody');
    const nameVal = document.getElementById('nameFilter').value.toLowerCase();
    const cardVal = document.getElementById('cardTypeFilter').value;
    const currVal = document.getElementById('currencyFilter').value;

    let q = collection(db, "customers");

    // 1. AD FİLTRİ (Əsas dəyişiklik buradadır)
    if (nameVal) {
        // Bu kod "ca" yazanda "Caresse", "Camilla" və s. hamısını tapacaq
        q = query(q, 
            where("first_name_lower", ">=", nameVal), 
            where("first_name_lower", "<=", nameVal + "\uf8ff")
        );
    }

    // 2. KART FİLTRİ
    if (cardVal) {
        q = query(q, where("card_type", "==", cardVal));
    }

    // 3. VALYUTA FİLTRİ
    if (currVal) {
        q = query(q, where("currency_code", "==", currVal));
    }

    // Əgər heç bir filtr yoxdursa, standart limit qoyaq
    if (!nameVal && !cardVal && !currVal) {
        q = query(q, limit(100));
    }

    try {
        const querySnapshot = await getDocs(q);
        let html = "";
        
        querySnapshot.forEach((doc) => {
            const u = doc.data();
            html += `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-4">
                        <div class="font-bold">${u.first_name} ${u.last_name}</div>
                        <div class="text-xs text-gray-400">${u.email}</div>
                    </td>
                    <td class="p-4 text-xs font-mono uppercase">${u.card_type}</td>
                    <td class="p-4 font-bold text-green-600">${u.moey}</td>
                    <td class="p-4">${u.country}</td>
                </tr>`;
        });

        tableBody.innerHTML = html || '<tr><td colspan="4" class="p-10 text-center">Nəticə tapılmadı</td></tr>';
    } catch (error) {
        console.error("Xəta:", error);
        // Əgər "Index Required" xətası çıxsa, konsoldakı linkə basmalısan
    }
}

        document.getElementById('searchBtn').addEventListener('click', getData);
        window.onload = getData;
    </script>
</body>
</html>
