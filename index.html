<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinPulse Pro | Bank Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        .modal-animate { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen">

    <nav class="max-w-[1600px] mx-auto p-6 flex justify-between items-center border-b border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black italic">FP</div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tighter uppercase leading-none">FinPulse Pro</h1>
                <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase">System Administrator</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button id="themeToggle" class="p-3 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 hover:scale-105 transition active:scale-95">
                <span id="themeIcon" class="text-lg">🌙</span>
            </button>
        </div>
    </nav>

    <header class="max-w-[1600px] mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="bg-white dark:bg-slate-900 p-6 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-sm">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Assets</p>
            <h3 id="totalUsers" class="text-3xl font-black italic">...</h3>
        </div>
        <div class="bg-white dark:bg-slate-900 p-6 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-sm">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Average Portfolio</p>
            <h3 id="avgBalance" class="text-3xl font-black text-emerald-500 italic">...</h3>
        </div>
        <div class="bg-white dark:bg-slate-900 p-6 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-sm">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Dominant Card</p>
            <h3 id="popCard" class="text-3xl font-black uppercase italic">...</h3>
        </div>
        <div class="bg-white dark:bg-slate-900 p-6 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-sm">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Last Update</p>
            <h3 id="lastUpdate" class="text-xs font-bold text-slate-500 mt-2">Checking...</h3>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto p-6 grid grid-cols-1 lg:grid-cols-5 gap-8">
        
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white dark:bg-slate-900 p-6 rounded-[2.5rem] shadow-sm flex flex-wrap gap-4 items-end border border-slate-100 dark:border-slate-800">
                <div class="flex-1 min-w-[200px]">
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block ml-1">Client Search</label>
                    <input type="text" id="nameFilter" placeholder="Type first name..." class="w-full p-4 bg-slate-50 dark:bg-slate-950 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500/20 transition">
                </div>
                <div class="w-48">
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block ml-1">Card Network</label>
                    <select id="cardTypeFilter" class="w-full p-4 bg-slate-50 dark:bg-slate-950 rounded-2xl border-none outline-none appearance-none">
                        <option value="">Global (All)</option>
                        <option value="visa">Visa</option>
                        <option value="mastercard">Mastercard</option>
                        <option value="jcb">JCB</option>
                        <option value="maestro">Maestro</option>
                    </select>
                </div>
                <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-2xl font-black uppercase tracking-tighter transition-all hover:shadow-lg hover:shadow-blue-500/20 active:scale-95">Search Data</button>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-xl border border-slate-100 dark:border-slate-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 dark:bg-slate-950/50 text-[10px] uppercase font-black text-slate-400 tracking-widest">
                            <tr>
                                <th class="p-6">Client Info</th>
                                <th class="p-6">Contact / Security</th>
                                <th class="p-6 text-center">Network</th>
                                <th class="p-6 text-right">Balance</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody" class="divide-y divide-slate-100 dark:divide-slate-800">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="lg:col-span-1">
            <div class="bg-slate-900 dark:bg-blue-600 p-8 rounded-[2.5rem] text-white sticky top-28 shadow-2xl">
                <h2 class="text-xl font-black mb-6 flex items-center gap-2 italic">
                    <span class="not-italic">💎</span> RICH LIST
                </h2>
                <div id="leaderboardList" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <div id="userModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-[3rem] shadow-2xl modal-animate relative flex flex-col max-h-[90vh] border border-slate-200 dark:border-slate-800">
            
            <div class="p-8 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between sticky top-0 bg-white dark:bg-slate-900 z-10 rounded-t-[3rem]">
                <div class="flex items-center gap-4">
                    <div id="modalInitial" class="w-16 h-16 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl font-black shadow-lg"></div>
                    <div>
                        <h2 id="modalName" class="text-2xl font-black tracking-tight text-slate-800 dark:text-white">...</h2>
                        <span id="modalId" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">ID: ...</span>
                    </div>
                </div>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-slate-50 dark:bg-slate-800 flex items-center justify-center font-bold hover:bg-red-50 hover:text-red-500 transition">✕</button>
            </div>

            <div id="modalContent" class="p-8 overflow-y-auto custom-scrollbar grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>

            <div class="p-8 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/20 rounded-b-[3rem]">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase">Current Liquidity</p>
                        <h4 id="modalBalance" class="text-3xl font-black text-emerald-500 italic">...</h4>
                    </div>
                    <div class="text-right">
                        <p id="modalCurrency" class="text-sm font-black text-slate-400 uppercase tracking-widest">...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, limit, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIG (Replace with your actual keys)
        const firebaseConfig = {
  apiKey: "AIzaSyAx-jHMIBpWtIRNHSK2NJRoTKmKl3Fst8Q",
  authDomain: "api-test-thefeerid.firebaseapp.com",
  databaseURL: "https://api-test-thefeerid-default-rtdb.firebaseio.com",
  projectId: "api-test-thefeerid",
  storageBucket: "api-test-thefeerid.firebasestorage.app",
  messagingSenderId: "129418422478",
  appId: "1:129418422478:web:970653fc985acb4ce4c89f",
  measurementId: "G-B5DVJXYZN2"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Dark Mode Logic
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.onclick = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            document.getElementById('themeIcon').innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        };

        // Load Analytics from analyze.js output
        async function loadStats() {
            try {
                const statsDoc = await getDoc(doc(db, "system", "dashboard_stats"));
                if (statsDoc.exists()) {
                    const s = statsDoc.data();
                    document.getElementById('totalUsers').innerText = s.totalUsers.toLocaleString();
                    document.getElementById('avgBalance').innerText = "$" + s.avgBalance;
                    document.getElementById('popCard').innerText = s.popularCard;
                    document.getElementById('lastUpdate').innerText = "System Sync: " + s.lastUpdated;

                    const lbHTML = s.topLeaderboard.map((u, i) => `
                        <div class="flex items-center justify-between p-4 bg-white/10 dark:bg-black/20 rounded-2xl border border-white/5 backdrop-blur-sm">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-black opacity-40 italic">#${i+1}</span>
                                <p class="text-sm font-bold truncate w-24">${u.name}</p>
                            </div>
                            <p class="text-sm font-black text-emerald-400 italic">$${u.balance.toLocaleString()}</p>
                        </div>
                    `).join('');
                    document.getElementById('leaderboardList').innerHTML = lbHTML;
                }
            } catch (e) { console.error(e); }
        }

        // Fetch and Table Render
        async function fetchUsers() {
            const tableBody = document.getElementById('userTableBody');
            const name = document.getElementById('nameFilter').value.toLowerCase();
            const card = document.getElementById('cardTypeFilter').value;

            tableBody.innerHTML = '<tr><td colspan="4" class="p-20 text-center animate-pulse text-slate-400">Querying Global Database...</td></tr>';

            let q = query(collection(db, "customers"), limit(50));
            if (name) q = query(q, where("first_name_lower", ">=", name), where("first_name_lower", "<=", name + "\uf8ff"));
            if (card) q = query(q, where("card_type", "==", card));

            const snapshot = await getDocs(q);
            
            tableBody.innerHTML = snapshot.docs.map(doc => {
                const u = doc.data();
                const genderIcon = u.gender === 'Female' ? '🚺' : '🚹';
                return `
                    <tr onclick='showUserDetails(${JSON.stringify(u)})' class="cursor-pointer hover:bg-blue-50/50 dark:hover:bg-blue-600/10 transition-all border-b border-slate-50 dark:border-slate-800/50 group">
                        <td class="p-6">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xs font-black group-hover:bg-blue-600 group-hover:text-white transition-colors uppercase italic">
                                    ${u.first_name[0]}${u.last_name[0]}
                                </div>
                                <div>
                                    <p class="font-bold text-sm tracking-tight">${u.first_name} ${u.last_name} <span class="text-[10px] ml-1 opacity-50 font-normal italic">${genderIcon}</span></p>
                                    <p class="text-[10px] text-slate-400 font-medium tracking-tight uppercase">${u.country} | ${u.city}</p>
                                </div>
                            </div>
                        </td>
                        <td class="p-6">
                            <p class="text-[11px] font-bold text-slate-700 dark:text-slate-300 tracking-tight">${u.email}</p>
                            <p class="text-[9px] font-mono text-slate-400 mt-1">IP: ${u.ip_address}</p>
                        </td>
                        <td class="p-6 text-center uppercase">
                            <span class="text-[9px] font-black px-3 py-1 bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg group-hover:border-blue-500/50 transition-colors">${u.card_type}</span>
                        </td>
                        <td class="p-6 text-right font-black text-blue-600 dark:text-blue-400 italic">
                            ${u.moey}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // MODAL DATA INJECTION
        window.showUserDetails = (user) => {
            document.getElementById('modalInitial').innerText = `${user.first_name[0]}${user.last_name[0]}`;
            document.getElementById('modalName').innerText = `${user.first_name} ${user.last_name}`;
            document.getElementById('modalId').innerText = `ID: ${user.id}`;
            document.getElementById('modalBalance').innerText = user.moey;
            document.getElementById('modalCurrency').innerText = `Currency: ${user.currency_code}`;

            const fields = [
                { label: 'Gender', val: user.gender },
                { label: 'Phone Number', val: user.phone },
                { label: 'IP Address', val: user.ip_address },
                { label: 'Postal Code', val: user.postal_code },
                { label: 'City', val: user.city },
                { label: 'Street', val: user.street },
                { label: 'IBAN Number', val: user.iban, full: true },
                { label: 'Card Number', val: user.card, full: true },
                { label: 'Card Type', val: user.card_type.toUpperCase() }
            ];

            document.getElementById('modalContent').innerHTML = fields.map(f => `
                <div class="${f.full ? 'md:col-span-2' : ''} p-5 bg-slate-50 dark:bg-slate-950/50 rounded-2xl border border-slate-100 dark:border-slate-800 group hover:border-blue-500/30 transition-colors">
                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">${f.label}</p>
                    <p class="text-sm font-bold tracking-tight text-slate-700 dark:text-slate-200 ${f.label.includes('Card') || f.label.includes('IBAN') ? 'font-mono' : ''}">${f.val}</p>
                </div>
            `).join('');

            document.getElementById('userModal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('userModal').classList.add('hidden');
        
        // Init
        document.getElementById('searchBtn').onclick = fetchUsers;
        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
            loadStats();
            fetchUsers();
        };
    </script>
</body>
</html>
